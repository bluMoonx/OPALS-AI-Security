<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parser Stress Test</title>
</head>
<body>
    <h1>Size and Complexity Test</h1>
    
    <!-- Deeply nested structure -->
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
    <div><div><div><div><div><div><div><div><div><div>
        Deep nested content at level 100
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    </div></div></div></div></div></div></div></div></div></div>
    
    <!-- Wide content -->
    <p style="word-break: keep-all;">
        ${'Nowhitespacebreak '.repeat(10000)}
    </p>
    
    <!-- Many attributes -->
    <div 
        data-a="1" data-b="2" data-c="3" data-d="4" data-e="5"
        data-f="6" data-g="7" data-h="8" data-i="9" data-j="10"
        ${Array(1000).fill(0).map((_, i) => `data-x${i}="${'x'.repeat(1000)}"`).join(' ')}
    >
        Element with many attributes
    </div>
    
    <!-- Large text nodes -->
    <script>
        // Generate massive inline content
        document.write('<p>' + 'A'.repeat(10000000) + '</p>');
    </script>
    
</body>
</html>
